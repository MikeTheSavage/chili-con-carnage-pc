; Chili Con Carnage PC input. Delete this file to get the defaults back.
; Key names: A-Z 0-9 F1-F12 Space Enter Escape Tab Backspace Up Down Left Right
;   LShift RShift LCtrl RCtrl LAlt RAlt Insert Delete Home End PageUp PageDown CapsLock
;   Comma Period Slash Semicolon Quote LBracket RBracket Backslash Minus Equals Grave Numpad0-Numpad9
; Letters mean the key at that position on a US keyboard, so WASD stays put on other layouts.
; Shift, Ctrl and Alt can be bound, but Windows has shortcuts on them (Sticky Keys, language switch, Alt+Tab).
; Targets: Cross Circle Square Triangle L R Start Select DpadUp DpadDown DpadLeft DpadRight
;   MoveForward MoveBack MoveLeft MoveRight Walk LookLeft LookRight LookUp LookDown None
; In the game: Cross jump/dive/use/confirm, Square shoot, Triangle reload, Circle weapon wheel and back in menus,
;   L target objects/exit stunt, R headshot mode, DpadLeft/DpadRight change weapon, DpadDown rewind, Start pause.

[Input]
; Written by the game. A file of the game's without it comes from an older build: its input sections are
;   replaced by the current defaults once and the old file is kept as ChiliNative.ini.bak.
Version=2
; dual_analog: WASD or the left stick moves and strafes, the mouse or the right stick turns and looks.
; psp: left/right turns the player and holding L strafes, as on the PSP; no looking up or down.
;   Delete this file after changing the scheme to get that scheme's default bindings.
Scheme=dual_analog
; Read input while another window has the focus.
BackgroundInput=false
; Input test: the title bar shows whether the mouse is captured, where its movement is measured (raw
;   relative, raw absolute or cursor) with the last counts, and the buttons and sticks sent to the game.
;   F3 switches it while playing; the same summary is printed when the game exits.
ShowInput=false
; The buttons the game shows on screen (its hints and the legends of its menus). auto: keys and mouse or
;   the pad's buttons, whichever was used last. keyboard, gamepad: always those. psp: the game's own PSP pictures.
Prompts=auto
; true: the right stick and the look keys turn the player by each frame's angle, like the mouse, and
;   mouse and stick go on turning him on the ground after a dive.
; false: the stick goes through the game's own turn rate, which it takes about every 70 ms and holds,
;   and on the ground after a dive nothing turns the player, as on the PSP.
ExactTurn=true

[Input.Keyboard]
; target=key[,key...]
MoveForward=W
MoveBack=S
MoveLeft=A
MoveRight=D
; Turning and looking without a mouse.
LookLeft=J
LookRight=L
LookUp=I
LookDown=K
Walk=X
; Space jumps and dives, E uses: the game has both on Cross.
Cross=Space,E,Enter
Circle=F,Backspace
; Shoot without a mouse.
Square=G
; Reload.
Triangle=R
L=Q
R=V
DpadUp=Up
DpadDown=Down,Z
; Previous and next weapon.
DpadLeft=Left,1
DpadRight=Right,2
; Pause.
Start=Escape
Select=Tab
; Stick deflection while Walk is held (0.31 to 1).
WalkScale=0.6
; Look keys: 1 = the engine's own full rate, about 170 degrees per second of turn and 57 of pitch (0.05 to 1).
LookKeySpeed=0.7
; Frees or captures the mouse.
ToggleMouseCapture=F1
; Switches the input test line in the title bar.
ToggleInputDisplay=F3

[Input.Mouse]
Enabled=true
; click: a click in the window captures the mouse (hidden and kept inside the window); it is freed in
;   menus and cutscenes, with F1, with Alt+Tab and when another window takes the focus.
; never: buttons work without capturing, no mouse look.
Capture=click
; In menus, movies and cutscenes a left click is Cross (confirm, skip) and a right click Circle (back),
;   whatever Mouse1 and Mouse2 are bound to below; those bindings are for play.
MenuClicks=true
Mouse1=Square
Mouse2=R
Mouse3=Circle
Mouse4=None
Mouse5=None
WheelUp=DpadRight
WheelDown=DpadLeft
; Degrees the player turns (X) and the view pitches (Y) per mouse count (0.001 to 5).
SensitivityX=0.08
SensitivityY=0.08
InvertX=false
InvertY=false
; While the mouse is captured the view keeps the pitch it was given. false: the game levels the view
;   again whenever the player moves, as it does for a thumb stick.
HoldPitch=true
; true: the player turns and the view pitches by exactly the angle the mouse moved, in the frame it moved.
;   false: the mouse pushes the second stick, which the game reads about every 70 ms and holds.
Exact=true
; 0 = none. Up to 0.95 averages the movement over more frames.
Smoothing=0

[Input.Gamepad]
Enabled=true
; auto: every pad is read and the one touched last is used. 0-3: only the pad in that XInput slot.
Index=auto
A=Cross
B=Circle
X=Triangle
Y=Cross
LB=DpadLeft
RB=DpadRight
LT=R
RT=Square
LS=L
RS=None
Back=Select
Start=Start
DpadUp=DpadUp
DpadDown=DpadDown
DpadLeft=DpadLeft
DpadRight=DpadRight
; Stick travel that counts as centred (0 to 0.9) and how far a trigger must be pulled (0.01 to 1).
DeadzoneLeft=0.24
DeadzoneRight=0.24
TriggerThreshold=0.12
; Start moving as soon as the stick leaves its dead zone instead of after the engine's extra 30%.
CompensateEngineDeadzone=true
; Right stick at full deflection: 1 = the engine's own rate, about 170 degrees per second of turn (X) and
;   57 of pitch (Y). 0 to 4.
TurnSensitivity=1.0
LookSensitivity=1.0
InvertY=false
; How the pad's buttons are drawn on screen: auto (by the pad in use), xbox or playstation.
Glyphs=auto
; Read PlayStation pads (DualShock 4, DualSense) directly, by USB or Bluetooth. false: XInput pads only.
PlayStationPads=true
; Vibration strength, 0 (off) to 1.
Rumble=1
; A section [Input.Gamepad.PlayStation] with any of the sixteen button lines above gives a PlayStation pad
;   targets of its own. Its buttons go by position: Cross is A, Circle B, Square X, Triangle Y, L1 LB, R1 RB,
;   L2 LT, R2 RT, L3 LS, R3 RS, Share or Create is Back, Options is Start.

[Mods]
; Mods live in the "mods" folder beside this file; see README.md there.
; Folder=mods
; Mod folders to load. A later name wins over an earlier one. Without this line every folder is
; loaded in alphabetical order; an empty list loads none.
; Enabled=first_mod,second_mod
; Print each archive file the first time the game reads it.
; LogFiles=false
; Write every texture the game draws with, once, as texture_dump\<key>.png beside this file.
; A picture at mods\<mod>\textures\<key>.png replaces that texture (mods\TEXTURES.md).
; DumpTextures=false

[Game]
; Game frames per second: 1 = 60 (the default when you play), 2 = 30 as on the PSP. Use 2 when the
; game cannot hold 60: the sound then crackles and the game runs slow.
; FrameLock=1
; The camera behind the player on foot. tight: it stays within about 4 degrees of where the player
; faces, so the picture turns with the mouse (the default with Scheme=dual_analog). original: the
; game's own, which may trail by a half turn and catches up over a third of a second (the default
; with Scheme=psp).
; Camera=tight
; high: the game runs one step above the other programs' priority, so a busy PC cannot hold it back
; for a tenth of a second at a time (heard as a hole in the sound). normal: no such step.
; Priority=high

[Game.Config]
; key = value lines written over the engine's configpsp.txt, for example an archive of your own that
; is searched before the game's:
; filesystem = "mod.naz, assets00.naz"

[Rendering]
; How much the picture may cost: low (integrated graphics), medium, high. custom: only the keys below.
; Preset=high
; d3d12 draws on the graphics card. software is the slow reference renderer.
; Backend=d3d12
; Rendering resolution in multiples of the PSP's 480x272: auto fits the monitor (4 at 1080p, 8 at 2160p),
; or 1 to 8.
; InternalScale=auto
; Edge smoothing: off, fxaa (the 3D scene is smoothed after it is drawn; the HUD and text stay sharp),
; or msaa2, msaa4, msaa8 (multisampling, heavier).
; AntiAliasing=fxaa
; Anisotropic filtering of textures in the 3D scene: 1 (the game's own filter), 2, 4, 8 or 16.
; Anisotropy=16
; Textures in the 3D scene: game (as the game asks), linear (always smoothed) or nearest (always blocky).
; TextureFilter=game
; Ambient occlusion, a soft darkening of corners and creases: off, low or high.
; SSAO=off
; Start in borderless full screen. F11 or Alt+Enter switches while playing.
; Fullscreen=false
; Show each scene as soon as it is drawn, one game frame sooner than the PSP did (33 ms at 30 frames
; per second). false: at the game's own copy to the screen.
; EarlyPresent=true
; Draw on a second processor core while the game computes its next frame. false: one core does both.
; GeThread=true

[Audio]
; Milliseconds of sound kept ahead of the audio device (20 to 500). Raise it when the sound crackles;
; every sound is heard this much later.
; BufferMs=70

[Disc]
; The game disc: your own copy of Chili Con Carnage (USA, ULUS-10216), as an .iso file or as the
; folder of an unpacked disc (the one that holds PSP_GAME and UMD_DATA.BIN). The game asks for it
; on the first start and writes the answer here. A path without a drive is taken from the folder
; of this file. Remove the line to be asked again.
; Path=C:\Games\Chili Con Carnage (USA).iso
