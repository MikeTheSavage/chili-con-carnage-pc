; Settings of scripted runs (run_replay.ps1, run_live.ps1, run_baseline.ps1) that name no CHILI_CONFIG of
; their own. The player's ChiliNative.ini beside the exe and the mods folder beside it are left out, so a
; replay gives the same state hashes whatever the player has set there. To test a setting or a mod in a
; scripted run, pass -Environment @{ CHILI_CONFIG = '<your ini>' } or CHILI_MODS_DIR.

[Input]
Scheme=psp
; The second stick turns through the game's own turn rate and nothing turns the player on the ground after
; a dive: the reference state hashes of the dual_analog replays were made that way. A replay with mouse
; angles that dives (replays\mouse_dive_*.replay, mouse_play.replay) wants an ini with ExactTurn=true.
ExactTurn=false
; The game's own PSP button pictures in its hints and menus: frame images of scripted runs are compared, and
; a scripted run has no device that was "used last" for the pictures to follow.
Prompts=psp

[Mods]

[Game]
; The game's own camera: the reference state hashes were made with it.
Camera=original

[Rendering]
; A scene is shown by the game's own copy to the screen, so frame images of the two renderers show the same frame.
EarlyPresent=false
; The display lists are drawn where the game hands them over, so a run's frame times compare with earlier builds'.
GeThread=false
; The game's own picture: no edge smoothing, the game's own texture filter, the glow as the game's draws say.
AntiAliasing=off
Anisotropy=1
Glow=game

[Audio]
